<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>흑백 요리사 - 리얼 조합 연구소</title>
  <style>
    :root {
      --bg-dark: #0a0a0a;
      --card-dark: #161616;
      --border-dark: #333333;
      --text-white: #ffffff;
      --text-gray: #aaaaaa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      display: flex;
      justify-content: center;
      padding: 40px 20px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    header {
      text-align: center;
      border-bottom: 2px solid var(--border-dark);
      padding-bottom: 20px;
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 900;
      letter-spacing: -1.5px;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 1.1rem;
      color: var(--text-gray);
    }

    .counter {
      margin-top: 14px;
      font-weight: 800;
      font-size: 1.1rem;
      color: #ffffff;
      background: #222;
      display: inline-block;
      padding: 6px 18px;
      border-radius: 20px;
      border: 1px solid #444;
    }

    .ingredient-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
    }

    .ingredient-btn {
      background-color: var(--card-dark);
      border: 2px solid var(--border-dark);
      border-radius: 14px;
      padding: 18px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text-white);
    }

    .ingredient-btn .emoji { font-size: 2.4rem; }
    .ingredient-btn .name { font-size: 1.1rem; font-weight: 700; }

    .ingredient-btn:hover {
      border-color: #888888;
      transform: translateY(-2px);
    }

    .ingredient-btn.selected {
      background-color: var(--text-white);
      color: var(--bg-dark);
      border-color: var(--text-white);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
    }

    .action-bar {
      display: flex;
      justify-content: center;
    }

    .submit-btn {
      background-color: var(--text-white);
      color: var(--bg-dark);
      border: none;
      padding: 18px 48px;
      font-size: 1.3rem;
      font-weight: 900;
      border-radius: 40px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .submit-btn:disabled {
      opacity: 0.25;
      cursor: not-allowed;
    }

    .result-section {
      display: none;
      flex-direction: column;
      gap: 24px;
    }

    .result-card {
      background-color: var(--card-dark);
      border: 2px solid var(--text-white);
      border-radius: 18px;
      padding: 28px;
    }

    .result-card.pairing {
      border: 1px dashed var(--text-gray);
      background-color: #111;
    }

    .badge {
      display: inline-block;
      background-color: var(--text-white);
      color: var(--bg-dark);
      font-size: 0.95rem;
      font-weight: 900;
      padding: 5px 14px;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .badge.pairing-badge {
      background-color: transparent;
      color: var(--text-white);
      border: 1px solid var(--text-white);
    }

    .dish-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }

    .dish-emoji { font-size: 3.8rem; }
    .dish-title { font-size: 1.8rem; font-weight: 900; line-height: 1.3; }

    .recipe-steps {
      color: #e0e0e0;
      font-size: 1.15rem;
      line-height: 1.8;
      margin-top: 12px;
      padding-left: 22px;
    }

    .recipe-steps li { margin-bottom: 8px; }

    .reset-btn {
      background-color: transparent;
      color: var(--text-white);
      border: 2px solid var(--text-white);
      padding: 16px 44px;
      font-size: 1.2rem;
      font-weight: 900;
      border-radius: 40px;
      cursor: pointer;
      align-self: center;
      margin-top: 12px;
      transition: all 0.2s ease;
    }

    .reset-btn:hover {
      background-color: var(--text-white);
      color: var(--bg-dark);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>흑백 요리사</h1>
      <p class="subtitle">어떤 독특한 3가지 재료도 리얼 요리로 연출합니다</p>
      <div class="counter" id="counter">재료를 2~3개 선택하세요</div>
    </header>

    <div class="ingredient-grid" id="ingredientGrid"></div>

    <div class="action-bar" id="actionBar">
      <button class="submit-btn" id="submitBtn" disabled>요리 시작하기</button>
    </div>

    <div class="result-section" id="resultSection">
      <div class="result-card">
        <span class="badge">메인 완성 요리</span>
        <div class="dish-header">
          <span class="dish-emoji" id="mainEmoji">🍳</span>
          <h2 class="dish-title" id="mainTitle">요리 이름</h2>
        </div>
        <ol class="recipe-steps" id="mainRecipe"></ol>
      </div>

      <div class="result-card pairing">
        <span class="badge pairing-badge">곁들이는 궁합 요리</span>
        <div class="dish-header">
          <span class="dish-emoji" id="pairEmoji">🥗</span>
          <h2 class="dish-title" id="pairTitle">요리 이름</h2>
        </div>
        <ol class="recipe-steps" id="pairRecipe"></ol>
      </div>

      <button class="reset-btn" id="resetBtn">다시 고르기</button>
    </div>
  </div>

  <script>
    const ingredients = [
      { id: 'pork', name: '돼지고기', emoji: '🥩', type: 'meat' },
      { id: 'beef', name: '소고기', emoji: '🍖', type: 'meat' },
      { id: 'chicken', name: '닭고기', emoji: '🍗', type: 'meat' },
      { id: 'shrimp', name: '새우', emoji: '🦐', type: 'seafood' },
      { id: 'egg', name: '계란', emoji: '🥚', type: 'base' },
      { id: 'tofu', name: '두부', emoji: '🫘', type: 'base' },
      { id: 'kimchi', name: '김치', emoji: '🥬', type: 'sauce' },
      { id: 'onion', name: '양파', emoji: '🧅', type: 'vege' },
      { id: 'garlic', name: '마늘', emoji: '🧄', type: 'vege' },
      { id: 'mushroom', name: '버섯', emoji: '🍄', type: 'vege' },
      { id: 'cheese', name: '치즈', emoji: '🧀', type: 'sauce' },
      { id: 'rice', name: '밥', emoji: '🍚', type: 'main' },
      { id: 'noodle', name: '면', emoji: '🍜', type: 'main' },
      { id: 'potato', name: '감자', emoji: '🥔', type: 'main' },
      { id: 'chili', name: '고추', emoji: '🌶️', type: 'sauce' },
      { id: 'tomato', name: '토마토', emoji: '🍅', type: 'sauce' }
    ];

    // 조리 스타일 정의 엔진 (재료 특성에 맞춰 자연스러운 메뉴와 레시피 자동 조합)
    function generateRecipe(items) {
      const names = items.map(i => i.name);
      const types = items.map(i => i.type);

      let main = {};
      let pair = {};

      // 1. 김치/고추 등 매콤한 재료 포함시
      if (types.includes('sauce') && (names.includes('김치') || names.includes('고추'))) {
        const core = items.find(i => i.type !== 'sauce') || items[0];
        const sub = items.find(i => i !== core && i.type !== 'sauce') || items[1] || items[0];
        
        main = {
          title: `스파이시 ${core.name} ${sub.name} 짜글이`,
          emoji: "🥘",
          steps: [
            `${core.name}와(과) ${sub.name}을(를) 먹기 좋은 크기로 썰어 냄비에 바싹 볶습니다.`,
            `김치와 고추 양념을 넣고 자작하게 물을 부어 센 불에서 푹 졸여냅니다.`,
            `국물이 빽빽해지면 불을 줄여 진한 매콤함과 깊은 감칠맛을 완성합니다.`
          ]
        };
        pair = {
          title: "부드러운 계란 푸딩",
          emoji: "🍲",
          steps: [
            "계란에 우유와 소금을 약간 넣어 잘 푼 뒤 체에 곱게 거릅니다.",
            "약불에서 찜기로 쪄내어 자극적인 매운맛을 달래주는 궁합을 완성합니다."
          ]
        };
      } 
      // 2. 치즈/토마토 포함 서양식 조합
      else if (names.includes('치즈') || names.includes('토마토')) {
        const mainIng = items.find(i => i.name !== '치즈' && i.name !== '토마토') || items[0];
        
        main = {
          title: `오븐 구이 ${mainIng.name} 토마토 치즈 그라탱`,
          emoji: "🫕",
          steps: [
            `${mainIng.name}을(를) 팬에서 올리브유와 함께 노릇하게 1차로 익혀냅니다.`,
            `토마토 소스 및 치즈를 팬 위에 켜켜이 얹고 오븐에서 180도로 구워냅니다.`,
            `치즈가 진득하게 녹아내릴 때 통후추를 갈아 풍미를 극대화합니다.`
          ]
        };
        pair = {
          title: "상큼한 오일 드레싱 샐러드",
          emoji: "🥗",
          steps: [
            "신선한 야채에 올리브유와 레몬즙을 가볍게 두릅니다.",
            "치즈의 리치함 뒤에 가벼운 산미를 불어넣어 밸런스를 맞춥니다."
          ]
        };
      } 
      // 3. 면/밥/감자 등 주식류 포함 시
      else if (types.includes('main')) {
        const mainIng = items.find(i => i.type === 'main');
        const sub1 = items.find(i => i !== mainIng) || items[0];
        const sub2 = items.find(i => i !== mainIng && i !== sub1) || sub1;

        main = {
          title: `철판 볶음 ${sub1.name} ${sub2.name} ${mainIng.name}`,
          emoji: "🍳",
          steps: [
            `${sub1.name}와(과) ${sub2.name}을(를) 달군 팬에 마늘과 함께 강불로 빠르게 볶습니다.`,
            `${mainIng.name}을(를) 투하하고 간장 및 굴소스로 속도감 있게 스터프라이합니다.`,
            `재료 겉면에 불향이 가득 배어들도록 들썩여 한 그릇에 담아냅니다.`
          ]
        };
        pair = {
          title: "아삭한 모듬 야채 피클",
          emoji: "🫙",
          steps: [
            "채소를 식초, 설탕, 물 동량 비율에 살짝 절여 만듭니다.",
            "탄수화물 요리의 묵직한 맛을 사각사각하게 잡아줍니다."
          ]
        };
      } 
      // 4. 고기/새우 중심의 프리미엄 구이/볶음
      else {
        main = {
          title: `셰프 특제 ${names[0]} & ${names[1]} 찹 스테이크`,
          emoji: "🥩",
          steps: [
            `${names[0]}와(과) ${names[1]}을(를) 큼직하게 한 입 크기로 깍둑썰기합니다.`,
            `달군 팬에 버터를 두르고 고온에서 겉면을 빠르게 구워 육즙을 가둡니다.`,
            names[2] ? `${names[2]}을(를) 마지막에 넣어 향을 입힌 후 후추로 마무리합니다.` : "스테이크 소스로 자작하게 코팅하여 풍미를 살려냅니다."
          ]
        };
        pair = {
          title: "알싸한 와사비 마요 딥",
          emoji: "🥣",
          steps: [
            "마요네즈에 생와사비와 레몬즙을 살짝 섞어 소스를 만듭니다.",
            "진한 요리에 깔끔한 알싸함을 더해 기름진 맛을 완벽히 차단합니다."
          ]
        };
      }

      return { main, pair };
    }

    let selectedIngredients = [];

    const gridEl = document.getElementById('ingredientGrid');
    const submitBtn = document.getElementById('submitBtn');
    const resetBtn = document.getElementById('resetBtn');
    const counterEl = document.getElementById('counter');
    const actionBar = document.getElementById('actionBar');
    const resultSection = document.getElementById('resultSection');

    function init() {
      gridEl.innerHTML = '';
      ingredients.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'ingredient-btn';
        btn.innerHTML = `
          <span class="emoji">${item.emoji}</span>
          <span class="name">${item.name}</span>
        `;
        btn.addEventListener('click', () => toggleSelect(item.id, btn));
        gridEl.appendChild(btn);
      });
    }

    function toggleSelect(id, element) {
      if (selectedIngredients.includes(id)) {
        selectedIngredients = selectedIngredients.filter(i => i !== id);
        element.classList.remove('selected');
      } else {
        if (selectedIngredients.length >= 3) {
          alert("재료는 최대 3개까지만 선택 가능합니다.");
          return;
        }
        selectedIngredients.push(id);
        element.classList.add('selected');
      }

      updateUI();
    }

    function updateUI() {
      const count = selectedIngredients.length;
      counterEl.textContent = `선택한 재료: ${count}개 (2~3개 선택 가능)`;
      submitBtn.disabled = !(count >= 2 && count <= 3);
    }

    submitBtn.addEventListener('click', () => {
      const selectedObjects = selectedIngredients.map(id => ingredients.find(item => item.id === id));
      const result = generateRecipe(selectedObjects);

      document.getElementById('mainEmoji').textContent = result.main.emoji;
      document.getElementById('mainTitle').textContent = result.main.title;
      renderSteps('mainRecipe', result.main.steps);

      document.getElementById('pairEmoji').textContent = result.pair.emoji;
      document.getElementById('pairTitle').textContent = result.pair.title;
      renderSteps('pairRecipe', result.pair.steps);

      gridEl.style.display = 'none';
      actionBar.style.display = 'none';
      resultSection.style.display = 'flex';
      counterEl.style.display = 'none';
    });

    function renderSteps(elementId, steps) {
      const container = document.getElementById(elementId);
      container.innerHTML = '';
      steps.forEach(step => {
        const li = document.createElement('li');
        li.textContent = step;
        container.appendChild(li);
      });
    }

    resetBtn.addEventListener('click', () => {
      selectedIngredients = [];
      document.querySelectorAll('.ingredient-btn').forEach(b => b.classList.remove('selected'));
      updateUI();

      gridEl.style.display = 'grid';
      actionBar.style.display = 'flex';
      resultSection.style.display = 'none';
      counterEl.style.display = 'inline-block';
    });

    init();
  </script>
</body>
</html>
